name: Prüfen und Offline-Paket bauen
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:spec && npm test && npm run build
      - run: npm run test:browser
        env:
          TEST_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testnachweise
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: Mission-Sinneslabor-offline
          path: dist/
