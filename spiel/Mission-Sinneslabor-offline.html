/* Round 2: the same semantic feedback colours on every answer surface. */
:root {
  --ink: #263936;
  --muted: #586562;
  --success: #176536;
  --success-bg: #e7f4e9;
  --error: #b42318;
  --error-bg: #fff0ed;
  --attention: #765200;
  --attention-bg: #fff3bf;
  --neutral: #586562;
}
.feedback.correct {color:var(--success);background:var(--success-bg);border-color:var(--success)}
.feedback.incorrect {color:var(--error);background:var(--error-bg);border-color:var(--error)}
.feedback.partial,.feedback.clarify,.feedback.help_requested,.feedback.too_long,.help-note,.feedback.solution {
  color:var(--attention);background:var(--attention-bg);border-left-color:var(--attention);
}
.feedback.empty {color:var(--neutral);background:#f0f1ed;border-left:4px solid #a1aaa5}
.clarification {color:var(--attention);background:var(--attention-bg);padding:18px;border:1px solid #c5a13a;border-radius:12px}
.part-feedback {color:var(--neutral)}
.part-feedback[data-state="correct"],.legend-correct {color:var(--success)}
.part-feedback[data-state="incorrect"],.legend-incorrect {color:var(--error)}
.part-feedback[data-state="partial"],.part-feedback[data-state="clarify"],.legend-partial {color:var(--attention)}
.is-correct .drop-target,.is-correct input,.choice.is-correct,textarea[data-answer-state="correct"] {
  border:2px solid var(--success);background:var(--success-bg);color:var(--success);
}
.is-incorrect .drop-target,.is-incorrect input,.choice.is-incorrect,textarea[data-answer-state="incorrect"] {
  border:2px solid var(--error);background:var(--error-bg);color:var(--error);
}
.is-partial .drop-target,.is-partial input,.is-clarify .drop-target,.is-clarify input,textarea[data-answer-state="partial"],textarea[data-answer-state="clarify"] {
  border:2px solid var(--attention);background:var(--attention-bg);color:var(--attention);

.is-correct .target-number,.is-correct .order-status {color:var(--success)}
.is-incorrect .target-number,.is-incorrect .order-status {color:var(--error)}
.is-partial .target-number,.is-clarify .target-number {color:var(--attention)}
